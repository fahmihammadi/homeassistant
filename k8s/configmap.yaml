apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-init-config
  namespace: homeassistant
data:
  configuration.yaml: |
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16       # K3s Pod CIDR
        - 192.168.50.0/24    # Homelab LAN CIDR
        - 127.0.0.1
